<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menghubungkan akun — Sora OTP</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/auth.css"></head><body><main class="auth-page"><section class="auth-card glass"><div class="auth-heading"><div class="eyebrow">GOOGLE AUTHENTICATION</div><h1>Menghubungkan akun<span>.</span></h1><p id="status">Sedang memverifikasi sesi Google kamu. Jangan tutup halaman ini.</p></div><div class="auth-error show" id="message" role="status" style="display:none"></div><a id="back" href="/login.html" style="display:none">Kembali ke login</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{const status=document.querySelector('#status'),message=document.querySelector('#message'),back=document.querySelector('#back');try{const cr=await fetch('/api/config',{cache:'no-store'});const cfg=await cr.json();if(!cr.ok||!cfg.supabaseUrl||!cfg.supabaseAnonKey)throw new Error('Supabase belum dikonfigurasi di Vercel.');if(!window.supabase?.createClient)throw new Error('Library Supabase gagal dimuat.');const client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,detectSessionInUrl:true}});const {data,error}=await client.auth.getSession();if(error)throw error;if(!data.session?.access_token)throw new Error('Sesi Google tidak ditemukan. Kembali ke login dan coba lagi.');const r=await fetch('/api/auth/supabase',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:data.session.access_token})});const out=await r.json();if(!r.ok)throw new Error(out.error||'Gagal menghubungkan akun.');location.replace('/dashboard.html');}catch(e){status.textContent='Login belum berhasil.';message.textContent=e.message||'Terjadi kesalahan.';message.style.display='block';back.style.display='inline-block';}})();
</script></body></html>
